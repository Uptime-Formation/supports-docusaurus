<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <!-- Titre -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Format de commit avec annotations IA
  </text>

  <!-- Commit classique (gauche) -->
  <g transform="translate(50, 100)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#64748b">Commit classique</text>

    <rect x="0" y="10" width="300" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />

    <!-- Header -->
    <rect x="10" y="20" width="280" height="30" rx="5" fill="#3b82f6" opacity="0.1" />
    <text x="20" y="40" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#1e40af">feat(auth): add JWT authentication</text>

    <!-- Footer -->
    <text x="20" y="80" font-family="Courier New, monospace" font-size="10" fill="#475569">Closes #123</text>

    <text x="150" y="115" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748b" font-style="italic">Standard</text>
  </g>

  <!-- Flèche -->
  <g transform="translate(380, 200)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#9333ea" stroke-width="3" />
    <polygon points="30,0 20,-5 20,5" fill="#9333ea" />
    <text x="15" y="-10" font-family="Arial, sans-serif" font-size="12" fill="#9333ea" text-anchor="middle">+IA</text>
  </g>

  <!-- Commit avec IA (droite) -->
  <g transform="translate(440, 100)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#9333ea">Commit avec annotations IA</text>

    <rect x="0" y="10" width="330" height="280" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="2" />

    <!-- Header -->
    <rect x="10" y="20" width="310" height="30" rx="5" fill="#3b82f6" opacity="0.1" />
    <text x="20" y="40" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#1e40af">feat(auth): add JWT authentication</text>

    <!-- Body -->
    <text x="20" y="70" font-family="Courier New, monospace" font-size="10" fill="#475569">Implement JWT-based auth with:</text>
    <text x="20" y="85" font-family="Courier New, monospace" font-size="10" fill="#475569">- User login endpoint</text>
    <text x="20" y="100" font-family="Courier New, monospace" font-size="10" fill="#475569">- Token generation/refresh</text>
    <text x="20" y="115" font-family="Courier New, monospace" font-size="10" fill="#475569">- Password hashing (bcrypt)</text>
    <text x="20" y="130" font-family="Courier New, monospace" font-size="10" fill="#475569">- Rate limiting</text>

    <!-- Separator -->
    <line x1="20" y1="145" x2="320" y2="145" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3" />

    <!-- AI Footer -->
    <rect x="10" y="155" width="310" height="110" rx="5" fill="#9333ea" opacity="0.05" />
    <text x="20" y="172" font-family="Courier New, monospace" font-size="10" font-weight="bold" fill="#7c3aed">🤖 AI-Assisted Development</text>
    <text x="20" y="188" font-family="Courier New, monospace" font-size="9" fill="#6b21a8">Tool: Claude Code (claude-sonnet-4-5)</text>
    <text x="20" y="203" font-family="Courier New, monospace" font-size="9" fill="#6b21a8">Agent: Autonomous implementation</text>
    <text x="20" y="218" font-family="Courier New, monospace" font-size="9" fill="#6b21a8">Prompt: Feature from specifications</text>
    <text x="20" y="233" font-family="Courier New, monospace" font-size="9" fill="#6b21a8">Human validation:</text>
    <text x="30" y="248" font-family="Courier New, monospace" font-size="9" fill="#6b21a8">- Security review: ✓</text>
    <text x="30" y="263" font-family="Courier New, monospace" font-size="9" fill="#6b21a8">- Tests: ✓ 95% coverage</text>

    <text x="165" y="285" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7c3aed" font-style="italic">Avec traçabilité IA</text>
  </g>

  <!-- Légende des parties -->
  <g transform="translate(50, 420)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Anatomie du commit avec IA</text>

    <!-- Header -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="700" height="50" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
      <text x="10" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">1. Header (obligatoire)</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" fill="#475569">Format: type(scope): description courte (&lt;72 caractères)</text>
    </g>

    <!-- Body -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="700" height="60" rx="5" fill="#f0fdf4" stroke="#10b981" stroke-width="2" />
      <text x="10" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#047857">2. Body (optionnel mais recommandé)</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" fill="#475569">Description détaillée des changements, motivations, contexte</text>
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#475569">Utiliser des bullet points pour la lisibilité</text>
    </g>

    <!-- Separator -->
    <g transform="translate(0, 170)">
      <line x1="0" y1="0" x2="700" y2="0" stroke="#d1d5db" stroke-width="2" stroke-dasharray="10,5" />
      <text x="350" y="-5" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Ligne vide puis séparateur visuel (---)</text>
    </g>

    <!-- AI Footer -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="700" height="90" rx="5" fill="#faf5ff" stroke="#9333ea" stroke-width="2" />
      <text x="10" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7c3aed">3. AI Annotations (nouveau !) 🤖</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Tool: Nom et version de l'outil IA utilisé</text>
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Agent: Niveau d'autonomie (suggestion, guidé, autonome)</text>
      <text x="10" y="70" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Human validation: Ce qui a été vérifié/validé par l'humain</text>
      <text x="10" y="85" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Prompt type (optionnel): Type de requête faite à l'IA</text>
    </g>
  </g>

  <!-- Note finale -->
  <text x="400" y="685" font-family="Arial, sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#64748b">
    Les annotations IA assurent la traçabilité et facilitent l'audit des changements
  </text>
</svg>
