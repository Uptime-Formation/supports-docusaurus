<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f9f9f9"/>
  <text x="50%" y="50" text-anchor="middle" font-size="24" fill="#333">Risques de fuite de données</text>

  <!-- Intellectual Property Risk -->
  <circle cx="200" cy="200" r="50" fill="#ffcccb"/>
  <text x="200" y="200" text-anchor="middle" font-size="16" fill="#333">Fuite IP</text>

  <!-- Secrets Exposure -->
  <circle cx="400" cy="200" r="50" fill="#ffcccb"/>
  <text x="400" y="200" text-anchor="middle" font-size="16" fill="#333">Exposition Secrets</text>

  <!-- Client Confidentiality Violation -->
  <circle cx="600" cy="200" r="50" fill="#ffcccb"/>
  <text x="600" y="200" text-anchor="middle" font-size="16" fill="#333">Violation Confidentialité</text>

  <!-- Regulatory Non-Compliance -->
