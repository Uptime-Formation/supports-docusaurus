<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <!-- Titre -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Niveaux de maturité : Configuration IA en entreprise
  </text>

  <!-- Axe horizontal -->
  <line x1="80" y1="630" x2="920" y2="630" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="920,630 910,625 910,635" fill="#94a3b8"/>

  <!-- Axe vertical -->
  <line x1="80" y1="630" x2="80" y2="100" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="80,100 75,110 85,110" fill="#94a3b8"/>

  <!-- Labels des axes -->
  <text x="500" y="665" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#64748b" font-weight="bold">Maturité organisationnelle</text>
  <text x="25" y="370" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#64748b" font-weight="bold" transform="rotate(-90 25 370)">Valeur / Impact</text>

  <!-- Niveau 1: Individuel -->
  <g transform="translate(120, 480)">
    <circle cx="0" cy="0" r="45" fill="#ef4444" opacity="0.2" stroke="#dc2626" stroke-width="3"/>
    <text x="0" y="-55" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Niveau 1</text>
    <text x="0" y="-35" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f1d1d">Bricolage</text>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">🔧</text>

    <text x="0" y="80" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#475569">• Fichiers locaux</text>
    <text x="0" y="95" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#475569">• Pas de partage</text>
    <text x="0" y="110" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#475569">• Copier-coller</text>
    <text x="0" y="125" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#475569">• Incohérence</text>
  </g>

  <!-- Niveau 2: Équipe -->
  <g transform="translate(300, 390)">
    <circle cx="0" cy="0" r="50" fill="#f59e0b" opacity="0.2" stroke="#d97706" stroke-width="3"/>
    <text x="0" y="-60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#d97706">Niveau 2</text>
    <text x="0" y="-40" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#78350f">Équipe</text>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">👥</text>

    <text x="0" y="80" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#475569">• Git repository</text>
    <text x="0" y="95" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#475569">• README.md</text>
    <text x="0" y="110" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#475569">• Conventions projet</text>
    <text x="0" y="125" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#475569">• Cohérence partielle</text>
  </g>

  <!-- Niveau 3: Organisation -->
  <g transform="translate(500, 280)">
    <circle cx="0" cy="0" r="55" fill="#10b981" opacity="0.2" stroke="#059669" stroke-width="3"/>
    <text x="0" y="-65" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#059669">Niveau 3</text>
    <text x="0" y="-45" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#064e3b">Organisation</text>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">🏢</text>

    <text x="0" y="85" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#475569">• Templates centralisés</text>
    <text x="0" y="100" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#475569">• Repository entreprise</text>
    <text x="0" y="115" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#475569">• URLs publiques</text>
    <text x="0" y="130" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#475569">• Standards partagés</text>
  </g>

  <!-- Niveau 4: Plateforme -->
  <g transform="translate(720, 190)">
    <circle cx="0" cy="0" r="60" fill="#3b82f6" opacity="0.2" stroke="#2563eb" stroke-width="3"/>
    <text x="0" y="-70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2563eb">Niveau 4</text>
    <text x="0" y="-50" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e3a8a">Plateforme</text>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">🚀</text>

    <text x="0" y="90" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#475569">• Serveur MCP</text>
    <text x="0" y="105" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#475569">• API d'initialisation</text>
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#475569">• Templates dynamiques</text>
    <text x="0" y="135" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#475569">• Automatisation totale</text>
  </g>

  <!-- Courbe de progression -->
  <path d="M 120,480 Q 300,400 500,280 Q 650,200 720,190" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-dasharray="8,4" opacity="0.6"/>

  <!-- Gains (côté droit) -->
  <g transform="translate(780, 200)">
    <rect x="0" y="0" width="200" height="410" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#7c3aed">Gains de maturité</text>

    <!-- Niveau 1 → 2 -->
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d97706">Niveau 1 → 2</text>
    <text x="15" y="70" font-family="Arial, sans-serif" font-size="9" fill="#475569">✓ Cohérence équipe</text>
    <text x="15" y="82" font-family="Arial, sans-serif" font-size="9" fill="#475569">✓ Versionnement</text>
    <text x="15" y="94" font-family="Arial, sans-serif" font-size="9" fill="#475569">✓ Historique changes</text>

    <!-- Niveau 2 → 3 -->
    <text x="10" y="120" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669">Niveau 2 → 3</text>
    <text x="15" y="135" font-family="Arial, sans-serif" font-size="9" fill="#475569">✓ Réutilisation cross-team</text>
    <text x="15" y="147" font-family="Arial, sans-serif" font-size="9" fill="#475569">✓ Standards entreprise</text>
    <text x="15" y="159" font-family="Arial, sans-serif" font-size="9" fill="#475569">✓ Onboarding rapide</text>
    <text x="15" y="171" font-family="Arial, sans-serif" font-size="9" fill="#475569">✓ Conformité facilitée</text>

    <!-- Niveau 3 → 4 -->
    <text x="10" y="197" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">Niveau 3 → 4</text>
    <text x="15" y="212" font-family="Arial, sans-serif" font-size="9" fill="#475569">✓ Automatisation complète</text>
    <text x="15" y="224" font-family="Arial, sans-serif" font-size="9" fill="#475569">✓ Personnalisation contexte</text>
    <text x="15" y="236" font-family="Arial, sans-serif" font-size="9" fill="#475569">✓ Mise à jour centralisée</text>
    <text x="15" y="248" font-family="Arial, sans-serif" font-size="9" fill="#475569">✓ Métriques et analytics</text>
    <text x="15" y="260" font-family="Arial, sans-serif" font-size="9" fill="#475569">✓ Zero configuration</text>

    <!-- ROI -->
    <line x1="10" y1="280" x2="190" y2="280" stroke="#d1d5db" stroke-width="1"/>
    <text x="10" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7c3aed">ROI estimé</text>
    <text x="15" y="318" font-family="Arial, sans-serif" font-size="9" fill="#475569">N1→N2: 30% gain temps</text>
    <text x="15" y="332" font-family="Arial, sans-serif" font-size="9" fill="#475569">N2→N3: 50% gain temps</text>
    <text x="15" y="346" font-family="Arial, sans-serif" font-size="9" fill="#475569">N3→N4: 80% gain temps</text>

    <line x1="10" y1="360" x2="190" y2="360" stroke="#d1d5db" stroke-width="1"/>
    <text x="15" y="380" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#059669">Qualité du code: ↗</text>
    <text x="15" y="394" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#059669">Conformité: ↗↗</text>
  </g>

  <!-- Note finale -->
  <text x="400" y="685" font-family="Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#64748b">
    La progression se fait par étapes : commencez simple (N2), industrialisez progressivement
  </text>
</svg>
