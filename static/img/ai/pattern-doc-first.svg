<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Titre -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Pattern 2 : Documentation avant code (Doc-First)
  </text>

  <!-- Étape 1 -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="#8b5cf6" opacity="0.2" stroke="#7c3aed" stroke-width="2"/>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#6b21a8">1. Spec en markdown</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="11" fill="#581c87">• Décrire la feature</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="11" fill="#581c87">• Cas d'usage</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="11" fill="#581c87">• Comportement attendu</text>
  </g>

  <!-- Flèche -->
  <line x1="220" y1="120" x2="250" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Étape 2 -->
  <g transform="translate(250, 80)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="#3b82f6" opacity="0.2" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">2. IA génère API spec</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">• OpenAPI 3.0</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">• Schémas de données</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">• Codes d'erreur</text>
  </g>

  <!-- Flèche -->
  <line x1="420" y1="120" x2="450" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Étape 3 -->
  <g transform="translate(450, 80)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="#10b981" opacity="0.2" stroke="#059669" stroke-width="2"/>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#047857">3. Générer tests</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="11" fill="#064e3b">• Depuis spec API</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="11" fill="#064e3b">• Tests fail (normal)</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="11" fill="#064e3b">• TDD ready</text>
  </g>

  <!-- Flèche vers étape 4 -->
  <line x1="530" y1="170" x2="530" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Étape 4 -->
  <g transform="translate(420, 200)">
    <rect x="0" y="0" width="220" height="80" rx="8" fill="#f59e0b" opacity="0.2" stroke="#d97706" stroke-width="2"/>
    <text x="110" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#92400e">4. Coder jusqu'à tests verts</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="11" fill="#78350f">• Implémenter selon spec</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="11" fill="#78350f">• Tests guident le dev</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="11" fill="#78350f">• Doc jamais obsolète</text>
  </g>

  <!-- Avantage -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="280" height="120" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="140" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">Avantages</text>
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">✓ Clarifie avant de coder</text>
    <text x="10" y="68" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">✓ Évite refactoring massif</text>
    <text x="10" y="86" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">✓ Doc écrite à chaud (jamais périmée)</text>
    <text x="10" y="104" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">✓ Tests dès le début</text>
  </g>

  <!-- Marker -->
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Note -->
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#64748b">
    La doc pilote le développement, pas l'inverse
  </text>
</svg>
