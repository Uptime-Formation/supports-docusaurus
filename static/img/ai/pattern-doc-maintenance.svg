<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Titre -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Pattern 3 : Maintenir la doc à jour
  </text>

  <!-- Trigger -->
  <g transform="translate(300, 70)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#ef4444" opacity="0.2" stroke="#dc2626" stroke-width="2"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">Déclencheur</text>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f1d1d">git push / PR merged</text>
  </g>

  <!-- Flèche -->
  <line x1="400" y1="140" x2="400" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- CI/CD Pipeline -->
  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="600" height="180" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="300" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#334155">CI/CD Pipeline</text>

    <!-- Check 1 -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="160" height="100" rx="5" fill="#3b82f6" opacity="0.1" stroke="#2563eb" stroke-width="1"/>
      <text x="80" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">1. Détection drift</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">• Code API changed?</text>
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">• OpenAPI diff</text>
      <text x="10" y="70" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">• Générer issue</text>
      <text x="10" y="85" font-family="Arial, sans-serif" font-size="10" fill="#1e3a8a">• Assigner dev</text>
    </g>

    <!-- Check 2 -->
    <g transform="translate(220, 50)">
      <rect x="0" y="0" width="160" height="100" rx="5" fill="#10b981" opacity="0.1" stroke="#059669" stroke-width="1"/>
      <text x="80" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#047857">2. Doc testing</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" fill="#064e3b">• Extraire exemples</text>
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#064e3b">• Exécuter code</text>
      <text x="10" y="70" font-family="Arial, sans-serif" font-size="10" fill="#064e3b">• Fail si cassé</text>
      <text x="10" y="85" font-family="Arial, sans-serif" font-size="10" fill="#064e3b">• Force update</text>
    </g>

    <!-- Check 3 -->
    <g transform="translate(420, 50)">
      <rect x="0" y="0" width="160" height="100" rx="5" fill="#f59e0b" opacity="0.1" stroke="#d97706" stroke-width="1"/>
      <text x="80" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">3. Auto-changelog</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" fill="#78350f">• Parse commits</text>
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#78350f">• IA réécriture</text>
      <text x="10" y="70" font-family="Arial, sans-serif" font-size="10" fill="#78350f">• Release notes</text>
      <text x="10" y="85" font-family="Arial, sans-serif" font-size="10" fill="#78350f">• Commit auto</text>
    </g>
  </g>

  <!-- Output -->
  <g transform="translate(250, 390)">
    <rect x="0" y="0" width="300" height="40" rx="5" fill="#10b981" opacity="0.2" stroke="#059669" stroke-width="2"/>
    <text x="150" y="27" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#047857">✓ Doc toujours à jour automatiquement</text>
  </g>

  <!-- Flèche vers output -->
  <line x1="400" y1="370" x2="400" y2="385" stroke="#64748b" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Marker -->
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
</svg>
