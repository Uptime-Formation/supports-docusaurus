<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <!-- Titre -->
  <text x="300" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    L'IA : un outil dans la boîte à outils du développeur
  </text>

  <!-- Boîte à outils -->
  <g>
    <!-- Corps de la boîte -->
    <path d="M 100 180 L 500 180 L 520 400 L 80 400 Z" fill="#dc2626" stroke="#991b1b" stroke-width="3" />
    <path d="M 100 180 L 500 180 L 500 200 L 100 200 Z" fill="#b91c1c" />

    <!-- Poignée -->
    <ellipse cx="300" cy="180" rx="60" ry="15" fill="#dc2626" stroke="#991b1b" stroke-width="3" />
    <path d="M 240 180 Q 240 140 300 120 Q 360 140 360 180" fill="none" stroke="#991b1b" stroke-width="4" stroke-linecap="round" />
    <path d="M 240 180 Q 240 140 300 120 Q 360 140 360 180" fill="none" stroke="#fca5a5" stroke-width="2" stroke-linecap="round" opacity="0.5" />

    <!-- Compartiments -->
    <line x1="200" y1="200" x2="200" y2="400" stroke="#991b1b" stroke-width="2" />
    <line x1="300" y1="200" x2="300" y2="400" stroke="#991b1b" stroke-width="2" />
    <line x1="400" y1="200" x2="400" y2="400" stroke="#991b1b" stroke-width="2" />

    <!-- Marteau (compilation) -->
    <g transform="translate(140, 260)">
      <rect x="-5" y="20" width="10" height="60" fill="#78350f" />
      <rect x="-25" y="5" width="50" height="25" rx="3" fill="#a8a29e" stroke="#57534e" stroke-width="2" />
      <text x="0" y="110" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#fef3c7">Compilation</text>
    </g>

    <!-- Tournevis (debugging) -->
    <g transform="translate(250, 260)">
      <rect x="-3" y="30" width="6" height="50" fill="#fbbf24" />
      <circle cx="0" cy="25" r="10" fill="#a8a29e" stroke="#57534e" stroke-width="2" />
      <line x1="-5" y1="25" x2="5" y2="25" stroke="#57534e" stroke-width="2" />
      <text x="0" y="110" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#fef3c7">Debugging</text>
    </g>

    <!-- Clé à molette (refactoring) -->
    <g transform="translate(350, 260)">
      <ellipse cx="0" cy="30" rx="12" ry="15" fill="#a8a29e" stroke="#57534e" stroke-width="2" />
      <rect x="-4" y="40" width="8" height="40" fill="#a8a29e" stroke="#57534e" stroke-width="2" />
      <rect x="8" y="35" width="15" height="8" fill="#a8a29e" stroke="#57534e" stroke-width="2" />
      <text x="0" y="110" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#fef3c7">Refactoring</text>
    </g>

    <!-- Robot IA (nouvel outil) -->
    <g transform="translate(450, 260)">
      <!-- Corps robot -->
      <rect x="-15" y="30" width="30" height="35" rx="3" fill="#9333ea" stroke="#6b21a8" stroke-width="2" />
      <!-- Tête -->
      <rect x="-12" y="15" width="24" height="18" rx="3" fill="#a855f7" stroke="#6b21a8" stroke-width="2" />
      <!-- Yeux -->
      <circle cx="-5" cy="23" r="3" fill="#fef3c7" />
      <circle cx="5" cy="23" r="3" fill="#fef3c7" />
      <!-- Antenne -->
      <line x1="0" y1="15" x2="0" y2="8" stroke="#6b21a8" stroke-width="2" />
      <circle cx="0" cy="6" r="3" fill="#fbbf24" />
      <!-- Bras -->
      <rect x="-18" y="40" width="6" height="3" fill="#9333ea" />
      <rect x="12" y="40" width="6" height="3" fill="#9333ea" />
      <text x="0" y="110" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#fef3c7" font-weight="bold">Assistant IA</text>
    </g>

    <!-- Niveau (tests) -->
    <g transform="translate(140, 330)">
      <rect x="-30" y="0" width="60" height="15" rx="3" fill="#22c55e" stroke="#15803d" stroke-width="2" />
      <circle cx="0" cy="7" r="5" fill="#fbbf24" />
      <line x1="-20" y1="7" x2="20" y2="7" stroke="#15803d" stroke-width="1" opacity="0.5" />
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#fef3c7">Tests</text>
    </g>
  </g>

  <!-- Message principal -->
  <g transform="translate(300, 450)">
    <rect x="-200" y="-15" width="400" height="50" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="2" />
    <text x="0" y="7" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#78350f" font-weight="bold">
      L'IA est un assistant, pas un remplacement
    </text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#92400e">
      Savoir quand utiliser quel outil reste essentiel
    </text>
  </g>
</svg>
