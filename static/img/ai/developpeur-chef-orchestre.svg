<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Titre -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Le développeur comme chef d'orchestre
  </text>

  <!-- Chef d'orchestre (développeur) au centre -->
  <g transform="translate(400, 250)">
    <!-- Podium -->
    <rect x="-40" y="50" width="80" height="60" fill="#78350f" stroke="#44403c" stroke-width="2" />
    <polygon points="-60,50 60,50 40,35 -40,35" fill="#92400e" stroke="#44403c" stroke-width="2" />

    <!-- Corps -->
    <ellipse cx="0" cy="0" rx="35" ry="45" fill="#1e40af" stroke="#1e3a8a" stroke-width="2" />

    <!-- Tête -->
    <circle cx="0" cy="-50" r="25" fill="#fbbf24" stroke="#f59e0b" stroke-width="2" />

    <!-- Yeux -->
    <circle cx="-8" cy="-52" r="3" fill="#1e293b" />
    <circle cx="8" cy="-52" r="3" fill="#1e293b" />

    <!-- Sourire -->
    <path d="M -10,-42 Q 0,-38 10,-42" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />

    <!-- Bras avec baguette -->
    <line x1="-25" y1="0" x2="-60" y2="-30" stroke="#1e40af" stroke-width="8" stroke-linecap="round" />
    <line x1="-60" y1="-30" x2="-90" y2="-50" stroke="#44403c" stroke-width="3" />
    <circle cx="-90" cy="-50" r="3" fill="#fbbf24" />

    <!-- Bras droit -->
    <line x1="25" y1="0" x2="50" y2="-20" stroke="#1e40af" stroke-width="8" stroke-linecap="round" />

    <!-- Label -->
    <text x="0" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">DÉVELOPPEUR</text>
  </g>

  <!-- 4 rôles disposés autour -->

  <!-- Manager de robots (haut gauche) -->
  <g transform="translate(150, 120)">
    <circle cx="0" cy="0" r="60" fill="#9333ea" opacity="0.1" />
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="36" text-anchor="middle">🤖</text>
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c3aed">Manager</text>
    <text x="0" y="32" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c3aed">de robots</text>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Supervise l'IA</text>
    <!-- Ligne de connexion -->
    <line x1="50" y1="40" x2="250" y2="200" stroke="#9333ea" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" />
  </g>

  <!-- Architecte (haut droit) -->
  <g transform="translate(650, 120)">
    <circle cx="0" cy="0" r="60" fill="#0ea5e9" opacity="0.1" />
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="36" text-anchor="middle">🏗️</text>
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0284c7">Architecte</text>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Définit le cadre</text>
    <!-- Ligne de connexion -->
    <line x1="-50" y1="40" x2="-150" y2="200" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" />
  </g>

  <!-- Validateur (bas gauche) -->
  <g transform="translate(150, 380)">
    <circle cx="0" cy="0" r="60" fill="#10b981" opacity="0.1" />
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="36" text-anchor="middle">✅</text>
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#059669">Validateur</text>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Vérifie qualité</text>
    <!-- Ligne de connexion -->
    <line x1="50" y1="-40" x2="250" y2="-70" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" />
  </g>

  <!-- Formateur (bas droit) -->
  <g transform="translate(650, 380)">
    <circle cx="0" cy="0" r="60" fill="#f59e0b" opacity="0.1" />
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="36" text-anchor="middle">📚</text>
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#d97706">Formateur</text>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Améliore prompts</text>
    <!-- Ligne de connexion -->
    <line x1="-50" y1="-40" x2="-150" y2="-70" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" />
  </g>

  <!-- Message en bas -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#64748b">
    Le développeur coordonne et orchestre les différents aspects de la collaboration avec l'IA
  </text>
</svg>
