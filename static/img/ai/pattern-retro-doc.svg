<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Titre -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Pattern 1 : Rétro-documenter du legacy
  </text>

  <!-- Étape 1 -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#3b82f6" opacity="0.2" stroke="#2563eb" stroke-width="2"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">1. Identifier</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">• Lister fichiers sans doc</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">• Prioriser (core vs utils)</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">• README ? API spec ?</text>
  </g>

  <!-- Flèche -->
  <line x1="240" y1="120" x2="280" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Étape 2 -->
  <g transform="translate(280, 80)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#10b981" opacity="0.2" stroke="#059669" stroke-width="2"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#047857">2. Batch générer</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="11" fill="#064e3b">• Script parcours fichiers</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="11" fill="#064e3b">• Template standard</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="11" fill="#064e3b">• IA génère doc</text>
  </g>

  <!-- Flèche -->
  <line x1="470" y1="120" x2="510" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Étape 3 -->
  <g transform="translate(510, 80)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#f59e0b" opacity="0.2" stroke="#d97706" stroke-width="2"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#92400e">3. Review humain</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="11" fill="#78350f">• Vérifier précision</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="11" fill="#78350f">• Ajouter contexte métier</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="11" fill="#78350f">• Corriger erreurs</text>
  </g>

  <!-- Output -->
  <g transform="translate(280, 200)">
    <rect x="0" y="0" width="240" height="120" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="120" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#047857">Résultat</text>
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="11" fill="#064e3b">✓ README.md complet</text>
    <text x="10" y="68" font-family="Arial, sans-serif" font-size="11" fill="#064e3b">✓ Docstrings dans tout le code</text>
    <text x="10" y="86" font-family="Arial, sans-serif" font-size="11" fill="#064e3b">✓ openapi.yaml généré</text>
    <text x="10" y="104" font-family="Arial, sans-serif" font-size="11" fill="#064e3b">✓ Onboarding facilité</text>
  </g>

  <!-- Flèche vers output -->
  <line x1="600" y1="170" x2="600" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="190" x2="400" y2="190" stroke="#64748b" stroke-width="2"/>
  <line x1="400" y1="190" x2="400" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Marker pour flèches -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Note -->
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#64748b">
    Automatisable : script pour 100+ fichiers en 1h
  </text>
</svg>
