<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <!-- Titre -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Workflow : Du ticket Jira à la Pull Request
  </text>

  <!-- Étape 1: User crée ticket -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#3b82f6" opacity="0.2" stroke="#2563eb" stroke-width="2"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e40af">1. User crée ticket</text>
    <text x="90" y="50" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">📝</text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">Feature ou bug à traiter</text>
  </g>

  <!-- Flèche -->
  <line x1="240" y1="110" x2="280" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Étape 2: Dev récupère via MCP -->
  <g transform="translate(280, 70)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#10b981" opacity="0.2" stroke="#059669" stroke-width="2"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#047857">2. Fetch via MCP</text>
    <text x="90" y="50" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">🔌</text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="11" fill="#064e3b">Agent MCP → Jira API</text>
  </g>

  <!-- Flèche -->
  <line x1="470" y1="110" x2="510" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Étape 3: Dev choisit ticket -->
  <g transform="translate(510, 70)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#f59e0b" opacity="0.2" stroke="#d97706" stroke-width="2"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400e">3. Sélection ticket</text>
    <text x="90" y="50" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">👆</text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="11" fill="#78350f">"Je prends celui-là"</text>
  </g>

  <!-- Flèche vers bas -->
  <line x1="600" y1="160" x2="600" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Étape 4: Planification avec personas -->
  <g transform="translate(420, 210)">
    <rect x="0" y="0" width="360" height="100" rx="8" fill="#8b5cf6" opacity="0.2" stroke="#7c3aed" stroke-width="2"/>
    <text x="180" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#6b21a8">4. Planification multi-agents</text>
    <text x="180" y="50" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">🧠</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="11" fill="#581c87">Persona Architecte: "Quelle structure ?"</text>
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="11" fill="#581c87">Persona Sécurité: "Quels risques ?"    Persona Testeur: "Quels tests ?"</text>
  </g>

  <!-- Flèche vers bas -->
  <line x1="600" y1="320" x2="600" y2="360" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Étape 5: Production TDD -->
  <g transform="translate(50, 370)">
    <rect x="0" y="0" width="320" height="100" rx="8" fill="#ec4899" opacity="0.2" stroke="#db2777" stroke-width="2"/>
    <text x="160" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#9f1239">5. Production code (TDD)</text>
    <text x="160" y="50" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">⚙️</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="11" fill="#831843">Spec → Tests → Code → Tests pass</text>
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="11" fill="#831843">Agent autonome génère tout</text>
  </g>

  <!-- Étape 6: Contrôle qualité -->
  <g transform="translate(430, 370)">
    <rect x="0" y="0" width="320" height="100" rx="8" fill="#06b6d4" opacity="0.2" stroke="#0891b2" stroke-width="2"/>
    <text x="160" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#164e63">6. Contrôle qualité</text>
    <text x="160" y="50" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">✅</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="11" fill="#155e75">Personas: sécurité, tests, architecture</text>
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="11" fill="#155e75">Validation cohérence et robustesse</text>
  </g>

  <!-- Flèches convergentes -->
  <line x1="210" y1="480" x2="210" y2="520" stroke="#64748b" stroke-width="2"/>
  <line x1="590" y1="480" x2="590" y2="520" stroke="#64748b" stroke-width="2"/>
  <line x1="210" y1="520" x2="400" y2="520" stroke="#64748b" stroke-width="2"/>
  <line x1="590" y1="520" x2="400" y2="520" stroke="#64748b" stroke-width="2"/>
  <line x1="400" y1="520" x2="400" y2="540" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Étape 7: PR créée -->
  <g transform="translate(250, 550)">
    <rect x="0" y="0" width="300" height="40" rx="8" fill="#10b981" opacity="0.3" stroke="#059669" stroke-width="3"/>
    <text x="150" y="27" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#047857">7. Pull Request prête → Review humain 👤</text>
  </g>

  <!-- Annotations côté -->
  <g transform="translate(770, 220)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748b">Focus dev:</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#64748b">• Qualité</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" fill="#64748b">• Cohérence</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="11" fill="#64748b">• Robustesse</text>

    <text x="0" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748b">Rôle dev:</text>
    <text x="0" y="100" font-family="Arial, sans-serif" font-size="11" fill="#64748b">• Valider architecture</text>
    <text x="0" y="115" font-family="Arial, sans-serif" font-size="11" fill="#64748b">• Review sécurité</text>
    <text x="0" y="130" font-family="Arial, sans-serif" font-size="11" fill="#64748b">• Décisions techniques</text>
  </g>

  <!-- Marker pour flèches -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
</svg>
