<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Titre -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Documentation Based Development
  </text>

  <!-- Ancien workflow (haut) -->
  <g transform="translate(100, 100)">
    <text x="0" y="-20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#64748b">Workflow traditionnel</text>

    <!-- Code d'abord -->
    <rect x="0" y="0" width="150" height="60" rx="5" fill="#94a3b8" stroke="#64748b" stroke-width="2" />
    <text x="75" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">1. Écrire le code</text>

    <!-- Flèche -->
    <defs>
      <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
      </marker>
    </defs>
    <line x1="150" y1="30" x2="180" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)" />

    <!-- Doc après -->
    <rect x="180" y="0" width="150" height="60" rx="5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
    <text x="255" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#475569">2. Documenter</text>
  </g>

  <!-- Nouveau workflow avec IA (bas) -->
  <g transform="translate(100, 240)">
    <text x="0" y="-20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#9333ea">Workflow avec IA</text>

    <!-- Doc d'abord -->
    <rect x="0" y="0" width="180" height="60" rx="5" fill="#a855f7" stroke="#7c3aed" stroke-width="2" />
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">1. Écrire la doc</text>
    <text x="90" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white" opacity="0.9">(ou commentaires)</text>

    <!-- Flèche avec IA -->
    <defs>
      <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea" />
      </marker>
    </defs>
    <line x1="180" y1="30" x2="235" y2="30" stroke="#9333ea" stroke-width="3" marker-end="url(#arrowPurple)" />

    <!-- Robot IA -->
    <g transform="translate(215, 10)">
      <circle cx="0" cy="10" r="20" fill="#fbbf24" opacity="0.2" />
      <text x="0" y="18" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">🤖</text>
    </g>

    <!-- Code généré -->
    <rect x="235" y="0" width="180" height="60" rx="5" fill="#9333ea" stroke="#7c3aed" stroke-width="2" />
    <text x="325" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">2. Code généré</text>
    <text x="325" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white" opacity="0.9">(par l'IA)</text>

    <!-- Flèche validation -->
    <line x1="415" y1="30" x2="450" y2="30" stroke="#9333ea" stroke-width="3" marker-end="url(#arrowPurple)" />

    <!-- Validation -->
    <rect x="450" y="0" width="180" height="60" rx="5" fill="#10b981" stroke="#059669" stroke-width="2" />
    <text x="540" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">3. Valider/Corriger</text>
  </g>

  <!-- Avantages -->
  <g transform="translate(450, 110)">
    <rect x="0" y="0" width="300" height="90" rx="5" fill="#f0fdf4" stroke="#10b981" stroke-width="2" />
    <text x="150" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#059669">✅ Avantages</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="12" fill="#047857">• Clarification de l'intention d'abord</text>
    <text x="10" y="62" font-family="Arial, sans-serif" font-size="12" fill="#047857">• Code documenté dès le départ</text>
    <text x="10" y="79" font-family="Arial, sans-serif" font-size="12" fill="#047857">• Gain de temps significatif</text>
  </g>

  <!-- Note -->
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#64748b">
    L'IA inverse le processus : on réfléchit d'abord, on code ensuite
  </text>
</svg>
