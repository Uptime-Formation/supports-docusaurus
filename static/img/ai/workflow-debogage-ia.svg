<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <!-- Titre -->
  <text x="350" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Workflow de débogage assisté par IA
  </text>

  <!-- Étapes en séquence -->
  <defs>
    <marker id="arrowDebug" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea" />
    </marker>
  </defs>

  <!-- Étape 1: Erreur -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="#ef4444" stroke="#dc2626" stroke-width="2" />
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">❌</text>
    <text x="70" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">1. Erreur</text>
    <text x="70" y="68" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white" opacity="0.9">Stack trace</text>
  </g>

  <!-- Flèche 1->2 -->
  <line x1="220" y1="160" x2="260" y2="160" stroke="#9333ea" stroke-width="3" marker-end="url(#arrowDebug)" />

  <!-- Étape 2: Capture contexte -->
  <g transform="translate(260, 120)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="2" />
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">📋</text>
    <text x="70" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">2. Contexte</text>
    <text x="70" y="68" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white" opacity="0.9">Code + erreur</text>
  </g>

  <!-- Flèche 2->3 -->
  <line x1="400" y1="160" x2="440" y2="160" stroke="#9333ea" stroke-width="3" marker-end="url(#arrowDebug)" />

  <!-- Étape 3: Analyse IA -->
  <g transform="translate(440, 120)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2" />
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">🤖</text>
    <text x="70" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">3. Analyse IA</text>
    <text x="70" y="68" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white" opacity="0.9">Diagnostic</text>
  </g>

  <!-- Flèche 3->4 (descente) -->
  <line x1="510" y1="200" x2="510" y2="240" stroke="#9333ea" stroke-width="3" marker-end="url(#arrowDebug)" />

  <!-- Étape 4: Suggestion correction -->
  <g transform="translate(440, 240)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="#3b82f6" stroke="#2563eb" stroke-width="2" />
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">💡</text>
    <text x="70" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">4. Suggestions</text>
    <text x="70" y="68" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white" opacity="0.9">Corrections</text>
  </g>

  <!-- Flèche 4->5 (gauche) -->
  <line x1="440" y1="280" x2="400" y2="280" stroke="#9333ea" stroke-width="3" marker-end="url(#arrowDebug)" />

  <!-- Étape 5: Application -->
  <g transform="translate(260, 240)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="#10b981" stroke="#059669" stroke-width="2" />
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">🔧</text>
    <text x="70" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">5. Application</text>
    <text x="70" y="68" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white" opacity="0.9">Corriger</text>
  </g>

  <!-- Flèche 5->6 (gauche) -->
  <line x1="260" y1="280" x2="220" y2="280" stroke="#9333ea" stroke-width="3" marker-end="url(#arrowDebug)" />

  <!-- Étape 6: Tests -->
  <g transform="translate(80, 240)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="#10b981" stroke="#059669" stroke-width="2" />
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">✅</text>
    <text x="70" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">6. Validation</text>
    <text x="70" y="68" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white" opacity="0.9">Tests ✓</text>
  </g>

  <!-- Retour en cas d'échec (pointillés rouge) -->
  <line x1="150" y1="240" x2="150" y2="200" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" marker-end="url(#arrowDebug)" />
  <text x="30" y="220" font-family="Arial, sans-serif" font-size="10" fill="#ef4444">Si échec</text>

  <!-- Note -->
  <text x="350" y="380" font-family="Arial, sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#64748b">
    L'IA accélère le diagnostic et propose des solutions, le développeur valide et teste
  </text>
</svg>
